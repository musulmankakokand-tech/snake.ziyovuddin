<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Snake</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  body { margin:0; display:flex; height:100vh; align-items:center; justify-content:center; background:#0f1724; color:#e6eef8; font-family:Inter,system-ui,Segoe UI,Arial; }
  #game { background:#071023; border:8px solid #0ea5a4; border-radius:12px; box-shadow:0 10px 30px rgba(2,6,23,.6); }
  canvas{ display:block; }
  .ui{ text-align:center; margin-top:12px; }
  button{ background:#0ea5a4; border:none; color:#052024; padding:8px 12px; border-radius:8px; font-weight:600; cursor:pointer; }
  .score { font-size:18px; margin-right:10px; }
  @media (max-width:600px){ #game{ transform:scale(.9);} }
</style>
</head>
<body>
<div>
  <div id="game">
    <canvas id="c" width="480" height="480"></canvas>
  </div>
  <div class="ui">
    <span class="score">Ball: <span id="score">0</span></span>
    <button id="restart">Qayta boshlash</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const restartBtn = document.getElementById('restart');

  const COLS = 24;
  const ROWS = 24;
  const CELL = canvas.width / COLS;
  let speed = 3; // frames per second

  let snake, dir, food, score, running, tickTimer;

  function reset() {
    snake = [{x:12,y:12},{x:11,y:12},{x:10,y:12}];
    dir = {x:1,y:0};
    placeFood();
    score = 0;
    speed = 8;
    running = true;
    scoreEl.textContent = score;
    if (tickTimer) cancelAnimationFrame(tickTimer);
    lastTime = performance.now();
    accumulator = 0;
    loop(lastTime);
  }

  function placeFood(){
    while(true){
      const p = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)};
      if (!snake.some(s=>s.x===p.x && s.y===p.y)) { food = p; break; }
    }
  }

  function draw(){
    // bg
    ctx.fillStyle = '#071023';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // grid (subtle)
    ctx.strokeStyle = 'rgba(255,255,255,0.02)';
    ctx.lineWidth = 1;
    for(let i=0;i<=COLS;i++){ ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,canvas.height); ctx.stroke(); }
    for(let j=0;j<=ROWS;j++){ ctx.beginPath(); ctx.moveTo(0,j*CELL); ctx.lineTo(canvas.width,j*CELL); ctx.stroke(); }

    // food
    ctx.fillStyle = '#ff6b6b';
    roundRect(ctx, food.x*CELL+4, food.y*CELL+4, CELL-8, CELL-8, 6, true);

    // snake
    snake.forEach((s,i)=>{
      ctx.fillStyle = i===0 ? '#6ee7b7' : '#10b981';
      roundRect(ctx, s.x*CELL+2, s.y*CELL+2, CELL-4, CELL-4, 6, true);
    });
  }

  function roundRect(ctx, x, y, w, h, r, fill) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    if (fill) ctx.fill();
  }

  function step(){
    if (!running) return;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    // wall hit
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { gameOver(); return; }
    // self hit
    if (snake.some(s => s.x === head.x && s.y === head.y)) { gameOver(); return; }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 1;
      scoreEl.textContent = score;
      placeFood();
      if (score % 3 === 0) speed = Math.min(20, speed + 1);
    } else {
      snake.pop();
    }
  }

  function gameOver(){
    running = false;
    // small overlay text
    ctx.fillStyle = 'rgba(2,6,23,0.7)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#f8fafc';
    ctx.font = '22px Inter, Arial';
    ctx.textAlign = 'center';
    ctx.fillText("O'yin tugadi!", canvas.width/2, canvas.height/2 - 10);
    ctx.font = '16px Inter, Arial';
    ctx.fillText("Qayta boshlash uchun tugmani bosing", canvas.width/2, canvas.height/2 + 20);
  }

  // game loop with fixed-step timing
  let lastTime = 0;
  let accumulator = 0;
  function loop(now){
    tickTimer = requestAnimationFrame(loop);
    const secPerFrame = 1 / speed;
    accumulator += (now - lastTime) / 1000;
    lastTime = now;

    if (accumulator >= secPerFrame) {
      step();
      draw();
      accumulator -= secPerFrame;
    }
  }

  // controls
  window.addEventListener('keydown', e=>{
    if (!running && (e.key === 'r' || e.key === 'R')) { reset(); return; }
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { if (dir.y !== 1) dir = {x:0,y:-1}; }
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { if (dir.y !== -1) dir = {x:0,y:1}; }
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { if (dir.x !== 1) dir = {x:-1,y:0}; }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { if (dir.x !== -1) dir = {x:1,y:0}; }
  });

  // mobile touch controls (simple)
  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    touchStart = {x: t.clientX, y: t.clientY};
  });
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 0 && dir.x !== -1) dir = {x:1,y:0};
      else if (dx < 0 && dir.x !== 1) dir = {x:-1,y:0};
    } else {
      if (dy > 0 && dir.y !== -1) dir = {x:0,y:1};
      else if (dy < 0 && dir.y !== 1) dir = {x:0,y:-1};
    }
    touchStart = null;
  });

  restartBtn.addEventListener('click', reset);

  // start
  reset();

})();
</script>
</body>
</html>
